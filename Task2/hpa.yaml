apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scaletestapp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaletestapp-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 20

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 4  # ждать 4 секунды перед масштабированием
      policies:
      - type: Percent
        value: 200  # увеличить на 200% за 10 секунд
        periodSeconds: 10
        

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scaletestapp-hpa-requests
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaletestapp-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Pods
    pods:
      metric:
        name: scaletestapp_requests_per_second  # Метрика, вычисленная через Prometheus recording rule
      target:
        type: AverageValue
        averageValue: "200"  # Среднее количество запросов в секунду на под
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 4
      policies:
      - type: Percent
        value: 200
        periodSeconds: 10
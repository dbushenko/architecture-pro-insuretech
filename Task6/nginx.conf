http {
    # Зона для ограничения запросов: 10 запросов в минуту на один IP
    limit_req_zone $binary_remote_addr zone=rate_limit:10m rate=10r/m;
    
    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применяем ограничение: burst=5 позволяет обработать кратковременные всплески
            # nodelay сразу отклоняет запросы сверх лимита без задержки
            limit_req zone=rate_limit burst=5 nodelay;
            
            # Возвращаем ошибку 429 при превышении лимита
            limit_req_status 429;
            
            proxy_pass http://backend_servers;
            
            # Добавляем заголовки для отладки (опционально)
            add_header X-RateLimit-Limit "10" always;
            add_header X-RateLimit-Remaining "$limit_req_status" always;
        }

        # Отдельный location для обработки ошибки 429 (опционально)
        error_page 429 /429.html;
        location = /429.html {
            internal;
            return 429 "Too Many Requests. Please try again later.\n";
        }
    }
}